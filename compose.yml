services:
  postgres:
    image: postgres:16-alpine
    container_name: nanolabs_trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nanolabs_trading}
      POSTGRES_USER: ${DB_USER:-nanolabs_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_secure_trading_pwd}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - nanolabs_trading_pgdata:/var/lib/postgresql/data
    networks:
      - nanolabs_trading_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nanolabs_admin} -d ${DB_NAME:-nanolabs_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nanolabs_trading_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_redis_pwd}
    volumes:
      - nanolabs_trading_redisdata:/data
    networks:
      - nanolabs_trading_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: nanolabs_trading_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      TIMEZONE: America/Argentina/Buenos_Aires
      DB_TYPE: sqlite
      DB_SQLITE_PATH: /app/data/trading.db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nanolabs_trading}
      DB_USER: ${DB_USER:-nanolabs_admin}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_secure_trading_pwd}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_pwd}
      BYBIT_REST_URL: https://api.bybit.com
      BYBIT_WS_URL: wss://stream.bybit.com/v5/public/linear
      BYBIT_DEFAULT_SYMBOL: BTCUSDT
      BYBIT_CATEGORY: linear
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - nanolabs_trading_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nanolabs_trading_net
      - proxy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: nanolabs_trading_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://nanotrading.nanoapps.ar}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://nanotrading.nanoapps.ar/ws/live}
      BACKEND_INTERNAL_URL: http://nanolabs_trading_backend:3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nanolabs_trading_net
      - proxy
    ports:
      - "127.0.0.1:3000:3000"

networks:
  nanolabs_trading_net:
    name: nanolabs_trading_net
    driver: bridge
  proxy:
    external: true

volumes:
  nanolabs_trading_pgdata:
    name: nanolabs_trading_pgdata
  nanolabs_trading_redisdata:
    name: nanolabs_trading_redisdata
  nanolabs_trading_data:
    name: nanolabs_trading_data
